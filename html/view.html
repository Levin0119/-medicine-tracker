<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5e9" />
  <title>医药箱查看 · 只读</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./view.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>💊</text></svg>" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <a href="./index.html" class="brand" aria-label="医药箱管理">
          <span class="brand-logo" aria-hidden="true">💊</span>
          <span class="brand-text">
            <strong>医药箱</strong>
            <small>只读查看</small>
          </span>
        </a>
        <div class="top-actions">
          <span class="ro-badge" title="该页面仅展示，不修改数据">只读模式</span>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- 加载状态 -->
      <section id="loading" class="loading-state">
        <div class="loading-illo" aria-hidden="true">📷</div>
        <h2 id="loading-title">等待扫描…</h2>
        <p class="muted" id="loading-msg">从药箱贴纸上扫二维码，或者从 URL 中包含 <code>#d=...</code> 的链接打开本页。</p>
      </section>

      <!-- 错误状态 -->
      <section id="error" class="loading-state hidden">
        <div class="loading-illo" aria-hidden="true">⚠️</div>
        <h2 id="error-title">数据无法解析</h2>
        <p class="muted" id="error-msg">二维码内容不合法或已损坏。</p>
      </section>

      <!-- 多码合并提示 -->
      <section id="multi-progress" class="multi-progress hidden">
        <h2>需要扫描 <span id="mp-total">0</span> 张码</h2>
        <p class="muted">已扫描 <span id="mp-current">0</span> / <span id="mp-total-2">0</span></p>
        <div class="mp-bar"><div class="mp-fill" id="mp-fill"></div></div>
        <p class="muted small">使用手机扫一扫按顺序扫描剩余二维码即可。</p>
      </section>

      <!-- 真实内容 -->
      <section id="content" class="hidden">
        <div class="page-head">
          <h1>药箱内容</h1>
          <p class="muted" id="today-line"></p>
        </div>

        <!-- 顶部紧急提示 -->
        <div id="alert-area"></div>

        <!-- 统计卡片 -->
        <div class="stats-grid" id="stats-grid">
          <article class="stat-card stat-total">
            <div class="stat-icon">💊</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-total">0</div>
              <div class="stat-label">药品</div>
            </div>
          </article>
          <article class="stat-card stat-dev">
            <div class="stat-icon">🩺</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-dev">0</div>
              <div class="stat-label">器材</div>
            </div>
          </article>
          <article class="stat-card stat-warning">
            <div class="stat-icon">⚠️</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-warning">0</div>
              <div class="stat-label">即将过期</div>
            </div>
          </article>
          <article class="stat-card stat-danger">
            <div class="stat-icon">⛔</div>
            <div class="stat-info">
              <div class="stat-value" id="stat-danger">0</div>
              <div class="stat-label">已过期</div>
            </div>
          </article>
        </div>

        <!-- Tabs -->
        <div class="tab-bar" id="tabs">
          <button class="tab active" data-tab="focus" type="button">⚠️ 待关注</button>
          <button class="tab" data-tab="meds" type="button">💊 全部药品</button>
          <button class="tab" data-tab="devs" type="button">🩺 器材</button>
          <button class="tab" data-tab="all" type="button">📋 完整列表</button>
        </div>

        <div id="tab-content"></div>

        <footer class="footer muted" style="margin-top:24px;text-align:center">
          <span>该页面仅展示扫描得到的数据快照，不会保存到本机浏览器。</span>
        </footer>
      </section>
    </main>
  </div>

  <script src="./qrcode.min.js"></script>
  <script src="./lz-string.min.js"></script>
  <script src="./view.js"></script>
</body>
</html>
